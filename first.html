<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #veer {
        background-color: black;
        color: white;
    }
    #paragraph {
        background-color: rgb(22, 8, 99);
        color: rgb(246, 247, 249);
    }
    #ram {
        background-color: rgb(22, 8, 99);
        color: rgb(246, 247, 249);

    }
</style>
<body>
    <h2 id="veer">VEER</h2>
    <p id="paragraph">This is a simple paragraph.</p>
    <div id="ram">
        <h3>Subheading</h3>
        <p>This is another paragraph inside a div.</p>
    </div>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
    <ol>
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>
</body>
</html>
