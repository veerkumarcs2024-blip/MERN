<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        background-color: aquamarine;
        margin: 0;
        padding: 0;
    }

    .grid{
        height: 80vh;
        justify-content: center;
        display: flex;
        border-color: 2px solid black;
        width: 80vh;
        background-color: azure;
        height: 80vh;
        display: grid;
        color: bisque;
        grid-template-columns: 1fr 4fr;
        grid-template-rows: 1fr 4fr 1fr;
    }
    .box1{
        border-color: 2px solid black;
    }
    .box2{
        border-color: 2px solid green
    }
    .box3{
        border-color: 2px solid red
    }
    .box4{
        border-color: 2px solid purple
    }
    .box5{
        border-color: 2px solid yellow;
    }

</style>
<body>
    <div class="grid">
        <div class="box1"> </div>
        <div class="box2"> </div>
        <div class="box3"> </div>
        <div class="box4"> </div>
        <div class="box5"> </div>
    </div>
</body>
</html>
