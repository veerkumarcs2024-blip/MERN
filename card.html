<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        background-color: rgb(244, 244, 247);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .larg {
        display: flex;
        border-radius: 10%;
        margin: 10%;
        display: flex;
        height: 80vh;
        width: 55vh;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border: 2px solid rgb(8, 8, 8);
    }

    .image {
        display: flex;
        align-items: center;
        margin: 10px;
        border: 2px solid black;
        height: 40%;
        border-radius: 10%;
        width: 90%;
        position: relative;
        flex-direction: row;
        justify-content: space-evenly;
        align-items: center;
    }

    .ve {
        display: flex;
        width: 400px;
        margin: 10px;
        height: 200px;
        flex-direction: column;
        justify-content: space-evenly;
        align-items: center;
        border: 2px solid rgb(246, 244, 244);
    }

    .be {
        display: flex;
        width: 200px;
        border-radius: 10%;
        margin: 10px;
        text-align: center;
        background-color: rgb(243, 220, 11);
        height: 80px;
        flex-direction: column;
        justify-content: space-evenly;
        align-items: center;
        border: 2px solid rgb(232, 243, 26);
    }

    .box1 {
        background-color: rgb(255, 255, 255);
        height: 50%;
        width: 90%;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        margin: 10px;
    }

    .box2 {
        background-color: rgb(251, 250, 250);
        height: 50%;
        width: 90%;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 10px;

    }

    h3 {
        font-size: 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
    }

    p {
        font-size: 15px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
    }
    .tag{
        width: 20%;
        background-color: rgb(8, 208, 239);
        border-radius: 5%;
        text-align: center;
        font-size: 15px;
        color: rgb(5, 5, 5);
        position: absolute;
        top: 20px;
        left: 10px;
    }
    .tag2{
        width: 20%;
        border-radius: 5%;
        text-align: center;
        font-size: 15px;
        color: rgb(5, 5, 5);
        position: absolute;
        top: 15px;
        right: 8px;
        
    }
</style>

<body>
    <div class="larg">
        <div class="image">
            <span class="tag">Best seller</span>
            <span class="tag2">
                <button>❤️</button>
            </span>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdsrUYoN1EXCl0FXyu61Ew68pssFFFy2mEiM3qan8ToQ&s=1000"
                alt="headphones" width="200px" height="200px">
            
        </div>
        <div class="ve">
            <div class="box1">
                <h2>Wireless Headphones</h2>
                <p>Price: Rupice 9999.99</p>
            </div>
            <div class="box2">
                <p>Experience the freedom of wireless audio with our high-quality headphones. Enjoy crystal-clear sound
                    and long-lasting comfort for all your listening needs.</p>
            </div>
        </div>
        <div class="be">
            <span>
            <img src="https://cdn-icons-png.flaticon.com/512/5665/5665446.png" alt="Add to Cart" width="30px"
                height="30px">
            <p> Add to Cart </p>
            </span>
        </div>
    </div>
</body>

</html>
